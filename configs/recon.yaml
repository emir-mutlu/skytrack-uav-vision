# Recon / ISR profile (unarmed UAV): detect people & vehicles, operator designates a track
# for persistent camera follow. COCO classes: 0 person, 2 car, 3 motorcycle, 5 bus, 7 truck.
# Swap in VisDrone-finetuned weights for much better small-object recall at altitude.
profile: recon
detector:
  kind: yolo
  model: yolo11n.pt
  conf: 0.30
  imgsz: 960
  classes: [0, 2, 3, 5, 7]
tracker:
  max_age: 30
  min_hits: 3
lock:
  zone: [0.15, 0.15, 0.85, 0.85]
  min_size_frac: 0.01
  acquire_seconds: 0.5
  require_operator_confirm: true
output:
  show: true
  telemetry: runs/recon.jsonl
camera:
  hfov_deg: 82
mavlink:
  enabled: false              # enable with: --mavlink <connection>
  connection: udpin:0.0.0.0:14550
  geolocate: true
  gimbal:
    follow: true
