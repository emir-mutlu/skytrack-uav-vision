[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skytrack"
version = "1.0.0"
description = "Real-time aerial target detection, multi-object tracking and target-lock pipeline for UAV video streams."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "opencv-python>=4.10",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pillow>=10.1",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.3"]
mavlink = ["pymavlink>=2.4.40"]
dev = ["pytest>=8", "ruff>=0.6", "pymavlink>=2.4.40"]

[project.scripts]
skytrack = "skytrack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 115
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
