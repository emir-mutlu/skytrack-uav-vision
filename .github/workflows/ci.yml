name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless
          pip install -e ".[dev]"
          pip install pytest-github-actions-annotate-failures
      - name: Lint
        run: ruff check src tests
      - name: Tests (incl. accuracy regression gate)
        run: pytest -q -rf --durations=5
      - name: Benchmark
        run: skytrack eval --config configs/demo.yaml --frames 600

  sitl:
    name: ArduPilot SITL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless
          pip install -e ".[dev]"
      - name: Download ArduCopter SITL (official stable build)
        run: |
          base=https://firmware.ardupilot.org/Copter/stable/SITL_x86_64_linux_gnu
          mkdir -p sitl
          curl -fsSL -o sitl/arducopter "$base/arducopter"
          chmod +x sitl/arducopter
          echo "firmware: $(curl -fsSL "$base/firmware-version.txt")"
          curl -fsSL "$base/git-version.txt" | head -3
      - name: SITL tests (telemetry, gimbal rate control, link-check, console)
        env:
          SKYTRACK_SITL_BIN: ${{ github.workspace }}/sitl/arducopter
        run: pytest -q -s -rA tests/test_sitl.py --junitxml=sitl-junit.xml
      - name: Report SITL results
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("sitl-junit.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          cases = list(suite.iter("testcase"))
          ok = [c.get("name") for c in cases if not any(c.find(t) is not None for t in ("skipped", "failure", "error"))]
          print(f"::notice title=ArduPilot SITL::{len(ok)}/{len(cases)} passed: {', '.join(ok)}")
          PY
