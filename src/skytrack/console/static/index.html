<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyTrack GCS</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="station">

  <header class="sb" aria-label="System status">
    <span class="sb-name">SKYTRACK GCS</span>
    <span class="sb-ann">
      <span class="ann ann-sim" id="a-sim" hidden>SIM</span>
      <span class="ann ann-sim" id="a-play" hidden>PLAYBACK</span>
      <span class="ann" id="a-view" hidden>VIEW ONLY</span>
    </span>
    <span class="sb-gap"></span>
    <span class="sb-f"><i>MODE</i><b id="v-mode">---</b></span>
    <span class="sb-f"><b id="v-arm">---</b></span>
    <span class="sb-f"><i>LINK</i><b id="v-link">---</b></span>
    <span class="sb-f"><i>GPS</i><b id="v-gps">---</b></span>
    <span class="sb-f"><i>BATT</i><b id="v-bat">---</b></span>
    <span class="sb-f sb-proc"><i>PROC</i><b id="v-proc">---</b></span>
    <span class="sb-f"><i>UTC</i><b id="v-clock">--:--:--</b></span>
    <button class="sb-brt" id="brt" type="button" title="Display brightness">DAY</button>
  </header>

  <main class="deck">
    <section class="mfd" id="mfd-a" aria-label="Main display">
      <div class="page" id="page-sens">
        <div class="osb osb-t">
          <span class="lg lg-box">EO</span><span></span><span></span><span></span>
          <button class="lg" id="osb-frz" type="button" aria-pressed="false" title="Freeze the video (Space)">FRZ</button>
        </div>
        <div class="osb osb-l">
          <button class="lg" id="osb-acq" type="button" title="Target acquisition: automatic, or by operator designation (A)"><small>ACQ</small><span id="lg-acq">AUTO</span></button>
          <span></span>
          <button class="lg" id="osb-brk" type="button" title="Break the lock (R)">BRK<br>LK</button>
          <span></span><span></span>
        </div>
        <div class="screen" id="scr-sens">
          <img id="video" alt="Payload video with tracking symbology">
          <div class="no-video" id="video-offline">NO VIDEO</div>
        </div>
        <div class="osb osb-r">
          <button class="lg" id="osb-gmb" type="button" title="Gimbal: follow the locked target, or hold (F)"><small>GMB</small><span id="lg-gmb">FLW</span></button>
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="osb osb-b">
          <button class="lg" id="osb-swap-a" type="button" title="Swap the displays (M)">SWAP</button>
          <span></span>
          <span class="lg lg-box">SENS</span>
          <span></span><span></span>
        </div>
      </div>
    </section>

    <section class="mfd" id="mfd-pfd" aria-label="Primary flight display">
      <div class="page page-plain">
        <div class="screen"><canvas id="pfd" aria-label="Primary flight display: flight modes, attitude, ground speed, altitude and heading with sensor and target bugs"></canvas></div>
      </div>
    </section>

    <section class="mfd" id="mfd-b" aria-label="Second display">
      <div class="page" id="page-hsd">
        <div class="osb osb-t"><span></span><span></span><span></span><span></span><span></span></div>
        <div class="osb osb-l">
          <button class="lg" id="osb-rng-up" type="button" title="Increase the range">&#9650;</button>
          <span class="lg"><small>RNG</small><span id="lg-rng">500</span></span>
          <button class="lg" id="osb-rng-dn" type="button" title="Decrease the range">&#9660;</button>
          <span></span><span></span>
        </div>
        <div class="screen"><canvas id="map" aria-label="Horizontal situation display: own aircraft, sensor footprint, tracks and line to the target"></canvas></div>
        <div class="osb osb-r">
          <button class="lg" id="osb-orient" type="button" title="Heading up or north up"><span id="lg-orient">HDG</span><small>UP</small></button>
          <button class="lg" id="osb-dep" type="button" title="Own aircraft depressed or centred"><span id="lg-dep">DEP</span></button>
          <span></span><span></span><span></span>
        </div>
        <div class="osb osb-b">
          <button class="lg" id="osb-swap-b" type="button" title="Swap the displays (M)">SWAP</button>
          <span></span>
          <span class="lg lg-box">HSD</span>
          <span></span><span></span>
        </div>
      </div>
    </section>

    <div class="dedrow">
      <section class="ded" aria-label="Target data">
        <h2>TGT DATA</h2>
        <div class="kv">
          <div><i>TRK</i><b id="g-trk">---</b></div>
          <div><i>STAT</i><b id="g-stat">---</b></div>
          <div class="w"><i>GRID</i><b id="g-grid">---</b></div>
          <div class="w"><i>LAT</i><b id="g-lat">---</b></div>
          <div class="w"><i>LON</i><b id="g-lon">---</b></div>
          <div><i>ELEV</i><b id="g-elev">---</b></div>
          <div><i>MTHD</i><b id="g-mthd">---</b></div>
          <div><i>SLR</i><b id="g-slr">---</b></div>
          <div><i>GR</i><b id="g-gr">---</b></div>
          <div><i>BRG</i><b id="g-brg">---</b></div>
          <div><i>LOCK</i><b id="g-lock">---</b></div>
          <div class="w"><i>LOS</i><b id="g-los">---</b></div>
          <div class="w"><i>BSE</i><b id="g-bse">---</b></div>
        </div>
      </section>

      <section class="ded" aria-label="Track file">
        <h2>TRACK FILE <span id="trk-count"></span></h2>
        <div class="tf-wrap">
          <table class="tf">
            <thead><tr><th>ID</th><th>CLS</th><th class="n">CONF</th><th class="n">AGE</th><th class="n">RNG</th><th class="n">BRG</th><th>GRID</th><th>STAT</th></tr></thead>
            <tbody id="tracks-body"></tbody>
          </table>
        </div>
      </section>

      <section class="ded" aria-label="Cautions and messages">
        <h2>CAS / MSG <span id="msg-count"></span></h2>
        <div class="cas">
          <span id="c-link">LINK</span><span id="c-gps">GPS</span><span id="c-batt">BATT</span>
          <span id="c-gmb">GMB</span><span id="c-trk">TRK</span><span id="c-vid">VID</span>
        </div>
        <ol class="msg" id="log"></ol>
      </section>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
